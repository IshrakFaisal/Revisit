name: revisit
description: A local library for links worth returning to.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.7
  flutter: '>=3.47.9'

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.2
  build_runner: ^2.17.1

flutter:
  uses-material-design: true
